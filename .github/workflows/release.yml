name: "🚀 发布 Release"
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workflow-plugin/package-lock.json
      - name: "📦 安装测试依赖"
        run: python -m pip install -r requirements-dev.txt
      - name: "🏗️ 构建全部发布包"
        shell: pwsh
        run: ./Build-Release-Packages.ps1
      - name: "⬆️ 创建或更新 GitHub Release"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -match '^AppleMusic-Style-Title-(ZH|EN|Windows-Installer)-v.*\.(zip|sha256)$' -or $_.Name -match '^AppleMusic-Style-Title-Script-v.*\.(zip|sha256)$' } | ForEach-Object FullName
          if (gh release view "${{ github.ref_name }}" 2>$null) {
            gh release upload "${{ github.ref_name }}" @files --clobber
          } else {
            gh release create "${{ github.ref_name }}" @files --verify-tag --generate-notes --title "${{ github.ref_name }}"
          }
